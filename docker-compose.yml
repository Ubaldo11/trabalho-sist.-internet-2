version: "3.9"

services:
  db-server:
    build: ./db
    container_name: db-server
    environment:
      POSTGRES_USER: servidores
      POSTGRES_PASSWORD: servidores123
      POSTGRES_DB: servidores_db
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U servidores -d servidores_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: backend
    environment:
      DATABASE_URL: postgresql://servidores:servidores123@db-server:5432/servidores_db
    depends_on:
      db-server:
        condition: service_healthy
    ports:
      - "5000:5000"
    networks:
      - app-network
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: frontend
    depends_on:
      - backend
    ports:
      - "8080:80"
    networks:
      - app-network
    restart: unless-stopped

volumes:
  db_data:

networks:
  app-network:
    driver: bridge